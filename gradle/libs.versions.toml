[versions]
kotlin = "2.3.21"
kotlinx-coroutines = "1.11.0"
ktlint = "14.2.0"
versionCatalogUpdate = "1.1.1"

[libraries]
cash-turbine = "app.cash.turbine:turbine:1.2.1"
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
w2sv-kotlinutils-coroutines = "io.github.w2sv:kotlinutils-coroutines:1.0.0"

[plugins]
kmp = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
vanniktech-maven-publish = "com.vanniktech.maven.publish:0.36.0"
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdate" }
