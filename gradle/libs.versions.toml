[versions]
# @keep
java = "17"
kotlin = "2.3.10"
kotlinx-coroutines = "1.10.2"
ktlint = "14.0.1"
versionCatalogUpdate = "1.1.0"
w2sv-datastoreutils = "0.0.8"

[libraries]
cash-turbine = "app.cash.turbine:turbine:1.2.1"
junit = "junit:junit:4.13.2"
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
w2sv-datastoreutils-datastoreflow = { module = "com.github.w2sv.DataStoreUtils:datastoreflow", version.ref = "w2sv-datastoreutils" }
w2sv-kotlinutils = "com.github.w2sv:KotlinUtils:0.2.2"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
versionCatalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "versionCatalogUpdate" }
